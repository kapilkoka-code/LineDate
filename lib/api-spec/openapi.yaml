openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: LINE authenticated API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: Auth
  - name: LINE
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [Auth]
      responses:
        "200":
          description: Current browser authentication state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      operationId: beginBrowserLogin
      tags: [Auth]
      parameters:
        - name: returnTo
          in: query
          required: false
          schema: { type: string }
      responses:
        "302": { description: Redirect to account login }
  /callback:
    get:
      operationId: handleBrowserLoginCallback
      tags: [Auth]
      responses:
        "302": { description: Complete login and redirect }
  /logout:
    get:
      operationId: logoutBrowserSession
      tags: [Auth]
      parameters:
        - name: returnTo
          in: query
          required: false
          schema: { type: string }
      responses:
        "302": { description: Clear session and redirect }
  /profile:
    get:
      operationId: getLineProfile
      tags: [LINE]
      responses:
        "200":
          description: Authenticated LINE profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LineProfile" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    patch:
      operationId: updateLineProfile
      tags: [LINE]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: Updated LINE profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LineProfile" }
        "400":
          description: Invalid display name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /letters:
    post:
      operationId: createLineLetter
      tags: [LINE]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLetterRequest" }
      responses:
        "201":
          description: Letter dropped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LetterRecord" }
        "400":
          description: Invalid letter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /letters/nearby:
    get:
      operationId: getNearbyLineLetters
      tags: [LINE]
      parameters:
        - { name: latitude, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: longitude, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: targetHandle, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 512 } }
      responses:
        "200":
          description: Target-scoped FIND guidance for an explicitly resolved God’s Eye signal
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NearbyLetterRecord" }
        "400":
          description: Invalid location
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /signals/field:
    get:
      operationId: getLineSignalField
      tags: [LINE]
      description: Privacy-preserving active signal field derived from a fixed, coarse spatial cell and LINE discovery ranking.
      parameters:
        - { name: latitude, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: longitude, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        "200":
          description: Ranked active signals without letter content, identity, coordinates, or precise spatial measurements.
          content:
            application/json:
              schema:
                type: array
                maxItems: 18
                items: { $ref: "#/components/schemas/SignalFieldRecord" }
        "400":
          description: Invalid field location
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /signals/resolve:
    post:
      operationId: resolveLineSignal
      tags: [LINE]
      description: Revalidates a short-lived signal-field handle before entering FIND. This does not unlock letter content.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignalResolutionRequest" }
      responses:
        "200":
          description: Revalidated FIND target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedSignalTarget" }
        "400":
          description: Invalid handle or location
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: Signal is no longer available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /letters/mine:
    get:
      operationId: getMyLineLetters
      tags: [LINE]
      responses:
        "200":
          description: Current user's letters
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OwnedLetterRecord" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /letters/{letterId}:
    get:
      operationId: getLineLetter
      tags: [LINE]
      parameters:
        - $ref: "#/components/parameters/LetterId"
        - { name: latitude, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: longitude, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: accuracy, in: query, required: true, schema: { type: number, minimum: 0, maximum: 25 } }
        - { name: observedAt, in: query, required: true, schema: { type: number, minimum: 0 } }
      responses:
        "200":
          description: Letter with text only when physically unlocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnlockedLetterRecord" }
        "403":
          description: Letter remains locked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: Letter not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /letters/{letterId}/replies:
    get:
      operationId: getRepliesForLetter
      tags: [LINE]
      parameters:
        - $ref: "#/components/parameters/LetterId"
        - { name: latitude, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: longitude, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        "200":
          description: Replies visible to the letter owner within 10m
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WriterReplyRecord" }
        "403":
          description: Ownership or proximity denied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    post:
      operationId: createLineReply
      tags: [LINE]
      parameters:
        - $ref: "#/components/parameters/LetterId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReplyRequest" }
      responses:
        "201":
          description: Reply sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SentReplyRecord" }
        "400":
          description: Invalid reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403":
          description: Proximity or ownership denied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /replies/mine:
    get:
      operationId: getMyLineReplies
      tags: [LINE]
      parameters:
        - { name: latitude, in: query, required: false, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: longitude, in: query, required: false, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        "200":
          description: Replies sent by the current user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SentReplyRecord" }
  /letters/{letterId}/relationships/{senderUserId}/reveal:
    post:
      operationId: revealLineIdentity
      tags: [LINE]
      parameters:
        - $ref: "#/components/parameters/LetterId"
        - name: senderUserId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationRequest" }
      responses:
        "200":
          description: Relationship reveal persisted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityRelationshipRecord" }
        "403":
          description: Ownership or proximity denied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /migration/local:
    post:
      operationId: migrateLocalLineData
      tags: [LINE]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalMigrationRequest" }
      responses:
        "200":
          description: Safe local data migration result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalMigrationResult" }
components:
  parameters:
    LetterId:
      name: letterId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 512 }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { type: string }
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id: { type: string }
        email: { type: [string, "null"], format: email }
        firstName: { type: [string, "null"] }
        lastName: { type: [string, "null"] }
        profileImageUrl: { type: [string, "null"] }
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    LineProfile:
      type: object
      required: [id, displayName, createdAt]
      properties:
        id: { type: string }
        displayName: { type: string }
        createdAt: { type: string, format: date-time }
    UpdateProfileRequest:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 40 }
    LocationRequest:
      type: object
      required: [latitude, longitude, accuracy]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracy: { type: number, minimum: 0 }
    CreateLetterRequest:
      allOf:
        - $ref: "#/components/schemas/LocationRequest"
        - type: object
          required: [id, text, visibility, anonymous, status]
          properties:
            id: { type: string, minLength: 1, maxLength: 128 }
            text: { type: string, minLength: 1, maxLength: 500 }
            visibility: { type: string, enum: [nearby] }
            anonymous: { type: boolean, const: true }
            status: { type: string, enum: [dropped] }
    LetterRecord:
      type: object
      required: [id, text, createdAt, latitude, longitude, accuracy, visibility, anonymous, status, isOwn]
      properties:
        id: { type: string }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        latitude: { type: number }
        longitude: { type: number }
        accuracy: { type: number }
        visibility: { type: string, enum: [nearby] }
        anonymous: { type: boolean, const: true }
        status: { type: string, enum: [dropped] }
        isOwn: { type: boolean }
    NearbyLetterRecord:
      type: object
      required: [id, text, createdAt, visibility, anonymous, status, isOwn, isUnlocked, distanceMeters, bearingDegrees]
      properties:
        id: { type: string }
        text: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        visibility: { type: string, enum: [nearby] }
        anonymous: { type: boolean, const: true }
        status: { type: string, enum: [dropped] }
        isOwn: { type: boolean }
        isUnlocked: { type: boolean }
        distanceMeters: { type: number, minimum: 0, maximum: 100 }
        bearingDegrees:
          type: number
          minimum: 0
          maximum: 359
          description: Server-computed initial bearing, quantized to a privacy-preserving directional sector.
    SignalFieldRecord:
      type: object
      additionalProperties: false
      required: [handle, hierarchy, distanceBand, bearingSector, availability, lifecycleKind, timeRemaining]
      properties:
        handle:
          type: string
          minLength: 1
          maxLength: 512
          description: Opaque, short-lived, user-bound handle used only to request FIND target revalidation.
        hierarchy:
          type: string
          enum: [primary, secondary, tertiary]
          description: Existing discovery prominence after coarse nearest-first ranking.
        distanceBand:
          type: string
          enum: [close, local, distant]
        bearingSector:
          type: string
          enum: [n, ne, e, se, s, sw, w, nw]
        availability:
          type: string
          enum: [active]
          description: The signal was active when this coarse field snapshot was issued. It never implies proximity unlock.
        lifecycleKind:
          type: string
          enum: [free, premium, permanent]
        timeRemaining:
          type: [string, "null"]
          enum: [under_1_day, under_7_days, under_30_days, under_60_days, null]
          description: Coarse active lifetime; null only for permanent signals.
    SignalResolutionRequest:
      type: object
      additionalProperties: false
      required: [handle, latitude, longitude]
      properties:
        handle: { type: string, minLength: 1, maxLength: 512 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    ResolvedSignalTarget:
      type: object
      additionalProperties: false
      required: [targetHandle]
      properties:
        targetHandle:
          type: string
          minLength: 1
          maxLength: 512
          description: Opaque, expiring FIND capability. The underlying letter identifier is never exposed to the browser.
    UnlockedLetterRecord:
      type: object
      required: [id, text, createdAt, visibility, anonymous, status, isOwn, isUnlocked, distanceMeters]
      properties:
        id: { type: string }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        visibility: { type: string, enum: [nearby] }
        anonymous: { type: boolean, const: true }
        status: { type: string, enum: [dropped] }
        isOwn: { type: boolean }
        isUnlocked: { type: boolean, const: true }
        distanceMeters: { type: number, minimum: 0 }
    OwnedLetterRecord:
      allOf:
        - $ref: "#/components/schemas/LetterRecord"
        - type: object
          required: [replyCount]
          properties:
            replyCount: { type: integer, minimum: 0 }
    CreateReplyRequest:
      allOf:
        - $ref: "#/components/schemas/LocationRequest"
        - type: object
          required: [id, text, status]
          properties:
            id: { type: string, minLength: 1, maxLength: 128 }
            text: { type: string, minLength: 1, maxLength: 500 }
            status: { type: string, enum: [sent] }
    WriterReplyRecord:
      type: object
      required: [id, letterId, text, createdAt, status, senderUserId, senderLineId, senderDisplayName, identityRevealed]
      properties:
        id: { type: string }
        letterId: { type: string }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        status: { type: string, enum: [sent] }
        senderUserId: { type: string }
        senderLineId: { type: string }
        senderDisplayName: { type: string }
        identityRevealed: { type: boolean }
    SentReplyRecord:
      type: object
      required: [id, letterId, text, createdAt, status, identityRevealed, withinRange, writerLineId, writerDisplayName]
      properties:
        id: { type: string }
        letterId: { type: string }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        status: { type: string, enum: [sent] }
        identityRevealed: { type: boolean }
        withinRange: { type: boolean }
        writerLineId: { type: [string, "null"] }
        writerDisplayName: { type: [string, "null"] }
    IdentityRelationshipRecord:
      type: object
      required: [letterId, senderUserId, identityRevealed]
      properties:
        letterId: { type: string }
        senderUserId: { type: string }
        identityRevealed: { type: boolean }
    LocalLetterMigration:
      allOf:
        - $ref: "#/components/schemas/CreateLetterRequest"
        - type: object
          required: [createdAt]
          properties:
            createdAt: { type: string, format: date-time }
    LocalMigrationRequest:
      type: object
      required: [localUserId, displayName, location, letters, replies]
      properties:
        localUserId: { type: string, maxLength: 64 }
        displayName: { type: string, minLength: 1, maxLength: 40 }
        location:
          $ref: "#/components/schemas/LocationRequest"
        letters:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/LocalLetterMigration" }
        replies:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/LocalReplyMigration" }
    LocalReplyMigration:
      type: object
      required: [id, letterId, text, createdAt, status]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        letterId: { type: string, minLength: 1, maxLength: 128 }
        text: { type: string, minLength: 1, maxLength: 500 }
        createdAt: { type: string, format: date-time }
        status: { type: string, enum: [sent] }
    LocalMigrationResult:
      type: object
      required: [migratedLetters, skippedLetters, migratedReplies, skippedReplies, linkedLocalUserId]
      properties:
        migratedLetters: { type: integer, minimum: 0 }
        skippedLetters: { type: integer, minimum: 0 }
        migratedReplies: { type: integer, minimum: 0 }
        skippedReplies: { type: integer, minimum: 0 }
        linkedLocalUserId: { type: string }